workflow: P2T2C Risk-Routed Workflow
language: zh-CN
supported_languages:
  - zh-CN
language_policy: monolingual_release_root
status: template

truth_root: docs/sot
proposal_root: docs/submit_proposals
change_pack_root: docs/change_packs
adr_root: docs/adr
spec_root: specs
closure_root: docs/closure
reference_root: docs/reference

canonical_entries:
  human: P2T2C_README.md
  ai: P2T2C_AGENTS.md

risk_levels:
  - R0
  - R1
  - R2

workflow_stages:
  - intent_admission
  - risk_routing_truth
  - work_batch_execution
  - verification_repair
  - drift_closure

human_gates:
  gate_a: Decide unresolved R2 semantics
  gate_b: Resolve Truth Drift

closure_decisions:
  - CLOSE

truth_documents:
  governance:
    - docs/sot/governance/P2T2C_GOVERNANCE.md
  governance_history:
    - docs/sot/governance/P2T2C_GOVERNANCE_HISTORY.md
  project_specific: []

forbidden_default_reads:
  - docs/reference/
  - docs/sot/governance/P2T2C_GOVERNANCE_HISTORY.md
