language_policy: "English-only language-specific release root"

core_managed:
  description: "Internal prompts, templates, and scripts; safely upgradeable when unmodified."
  paths:
    - ".p2t2c/prompts/**"
    - ".p2t2c/templates/**"
    - ".p2t2c/bin/**"
    - "docs/submit_proposals/SP_TEMPLATE.md"
    - "docs/change_packs/CPK_TEMPLATE.md"

governance_managed:
  description: "P2T2C governance, entries, metadata, and directory guidance; upgradeable when unmodified."
  paths:
    - "P2T2C_AGENTS.md"
    - "P2T2C_README.md"
    - ".p2t2c/CHECKSUMS.sha256"
    - ".p2t2c/VERSION"
    - ".p2t2c/P2T2C_LICENSE.md"
    - ".p2t2c/templates/project_config.example.yaml"
    - ".p2t2c/manifest.yaml"
    - ".p2t2c/ownership.yaml"
    - ".p2t2c/migrations/**"
    - "docs/adr/README.md"
    - "docs/submit_proposals/README.md"
    - "docs/change_packs/README.md"
    - "docs/closure/README.md"
    - "docs/reference/README.md"
    - "docs/sot/governance/P2T2C_GOVERNANCE.md"
    - "docs/sot/governance/P2T2C_GOVERNANCE_HISTORY.md"
    - "docs/sot/manifest.yaml"
    - "specs/README.md"

project_owned:
  description: "Upgrade must not write project business Truth, artifact instances, implementation, or tests."
  paths:
    - "docs/sot/product/**"
    - "docs/sot/data/**"
    - "docs/sot/api/**"
    - "docs/sot/client/**"
    - "docs/sot/server/**"
    - "docs/sot/ai/**"
    - "docs/sot/testing/**"
    - "docs/adr/ADR-*.md"
    - "docs/submit_proposals/SP-*.md"
    - "docs/change_packs/CPK-*.md"
    - "docs/closure/CR-*.md"
    - "specs/**"
    - "src/**"
    - "tests/**"
    - "database/**"
    - "package.json"
