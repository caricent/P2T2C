name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
  pull_request:

jobs:
  release-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Closure evidence verifies historical baseline/head commits and
          # their ancestry. A shallow checkout omits those commit objects and
          # would make valid historical receipts unverifiable.
          fetch-depth: 0

      - name: Run release checks
        shell: bash
        run: |
          make check
          make checksums

      - name: Run release smoke tests
        shell: bash
        run: bash scripts/release_smoke_test.sh
