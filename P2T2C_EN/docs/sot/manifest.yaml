workflow: P2T2C Exception-Gated Workflow
language: en-US
supported_languages:
  - en-US
language_policy: monolingual_release_root
status: template
truth_root: docs/sot
proposal_root: docs/submit_proposals
adr_root: docs/adr
spec_root: specs
reference_root: docs/reference

canonical_entries:
  human: P2T2C_README.md
  ai: P2T2C_AGENTS.md

human_gates:
  gate_a: Apply Change Pack
  gate_b: Resolve Truth Drift

closure_decisions:
  - CLOSE
  - BACKFILL_EXECUTION_DOCS
  - HUMAN_TRUTH_DECISION_REQUIRED

truth_documents:
  governance:
    - docs/sot/governance/P2T2C_GOVERNANCE.md
  governance_history:
    - docs/sot/governance/P2T2C_GOVERNANCE_HISTORY.md
  project_specific: []

# RULE-GOV-012: phase-scoped reading. AI reads only the rules a phase needs.
# The phase->rule map is derived from each rule's `Phases` field by
# `make check` and written to the generated map below; never hand-maintained.
phases:
  - bootstrap
  - change_pack
  - apply_change_pack
  - execution_pack
  - single_task
  - acceptance
  - install_upgrade
  - all
phase_rule_map: .p2t2c/generated/phase_rules.txt

notes:
  language_policy: "Managed workflow documents are English-only inside this release root."
  project_specific_truth: "Add real SoT files under docs/sot/** only when the project has current rules for that area."
  placeholder_domain_sot: "Not shipped; empty placeholder SoT files are intentionally omitted."
  phase_scoped_reading: "AI reads a phase's governance rule subset from phase_rule_map by phase token, instead of the whole governance file."

forbidden_default_reads:
  - docs/reference/
  - docs/sot/governance/P2T2C_GOVERNANCE_HISTORY.md
