language_policy: "中文单语语言专属发行根"

core_managed:
  description: "P2T2C 核心模板、prompt、执行模板和脚本。除用户可复制的入口模板外，内部资产位于 .p2t2c 下。未被本地修改时可安全自动升级。"
  paths:
    - ".p2t2c/prompts/**"
    - ".p2t2c/templates/**"
    - ".p2t2c/templates/adr/ADR_TEMPLATE.md"
    - ".p2t2c/templates/execution/**"
    - ".p2t2c/bin/check_p2t2c.sh"
    - ".p2t2c/bin/p2t2c_install.sh"
    - ".p2t2c/bin/p2t2c_upgrade.sh"
    - "docs/submit_proposals/SP_TEMPLATE.md"

governance_managed:
  description: "P2T2C 治理、入口、元数据和模板文档。仅在上次 lock 后未改变时升级。"
  paths:
    - "P2T2C_AGENTS.md"
    - ".p2t2c/CHECKSUMS.sha256"
    - ".p2t2c/VERSION"
    - "P2T2C_README.md"
    - ".p2t2c/P2T2C_LICENSE.md"
    - ".p2t2c/templates/project_config.example.yaml"
    - "docs/adr/README.md"
    - "docs/submit_proposals/README.md"
    - "docs/closure/README.md"
    - "docs/reference/README.md"
    - "docs/sot/governance/P2T2C_GOVERNANCE.md"
    - "docs/sot/manifest.yaml"
    - "specs/README.md"
    - ".p2t2c/manifest.yaml"
    - ".p2t2c/ownership.yaml"
    - ".p2t2c/migrations/**"

obsolete_managed:
  description: "旧版 P2T2C 受管文件；当 lock hash 证明它们未被本地修改时可移除。"
  sources:
    - ".p2t2c/migrations/0.2.0-to-0.3.0.md"
    - ".p2t2c/migrations/0.5.0-to-0.6.0.md"
    - ".p2t2c/migrations/0.6.0-to-0.7.0.md"

project_owned:
  description: "项目业务 Truth、实现和历史产物。升级脚本不得写入这些路径，除非移除迁移文件列出的未修改旧占位模板。"
  paths:
    - "docs/sot/ai/**"
    - "docs/adr/ADR-*.md"
    - "docs/submit_proposals/SP-*.md"
    - "docs/closure/CR-*.md"
    - "specs/**"
    - "src/**"
    - "tests/**"
    - "database/**"
    - "package.json"
