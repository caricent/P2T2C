# Project-owned compact overlay. Managed defaults live in .p2t2c/defaults.yaml.
project:
  name: "YourProject"
  description: "Replace with the project description"
  language: "en-US"
  language_policy: "monolingual_release_root"

methodology:
  profile: "p2t2c-adaptive-v2"
  enforcement: "advisory"
  tdd: "risk_aware"
  debugging: "root_cause_first"
  review:
    r1_production_code: "required"
    r2: "required"
  isolation: "auto"
  parallel_execution: "owned_isolated_only"
  fan_out: "controller_only"
  wait_strategy: "event_driven"

# Omit inherited sections. If overriding methodology, verification, or path
# mapping, declare the complete controlled section; partial overrides fail.
