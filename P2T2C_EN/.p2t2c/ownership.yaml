language_policy: "English-only language-specific release root"

managed_file_manifest:
  path: ".p2t2c/managed-files.txt"
  mode_policy: ".p2t2c/managed-modes.txt"
  authority: "install_upgrade_checksum_and_required_asset_inventory"

core_managed:
  description: "Core actions, document validation, explicit migration, templates, schemas, and legacy compatibility engines; exact membership comes from managed-files.txt."
  paths:
    - ".p2t2c/bin/**"
    - ".p2t2c/lib/**"
    - ".p2t2c/schemas/**"
    - ".p2t2c/templates/**"
    - ".p2t2c/skills/**"
    - ".p2t2c/prompts/**"
    - ".p2t2c/evals/**"
    - ".p2t2c/defaults.yaml"

governance_managed:
  description: "Entries, current P2T2C governance Truth, directory guidance, and release metadata."
  paths:
    - "P2T2C_AGENTS.md"
    - "P2T2C_README.md"
    - "docs/proposals/README.md"
    - "docs/specs/README.md"
    - "docs/reference/README.md"
    - "docs/reference/OPENSPEC_ATTRIBUTION.md"
    - "docs/reference/SUPERPOWERS_ATTRIBUTION.md"
    - "docs/reference/archive/README.md"
    - "docs/sot/governance/P2T2C_GOVERNANCE.md"
    - "docs/sot/governance/P2T2C_GOVERNANCE_HISTORY.md"
    - "docs/sot/manifest.yaml"

runtime_generated:
  description: "Local transactions, legacy runs, and caches; never copied from the release inventory."
  paths:
    - ".p2t2c/lock.sha256"
    - ".p2t2c/install/**"
    - ".p2t2c/upgrade/**"
    - ".p2t2c/docs-migrate/**"
    - ".p2t2c/runs/**"
    - ".p2t2c/cache/**"

project_owned:
  description: "Normal install/upgrade cannot modify project SOT, active documents, cold archive, implementation, or tests."
  paths:
    - ".p2t2c/project_config.yaml"
    - "docs/sot/** (except the three exact release-managed governance/manifest files above)"
    - "docs/proposals/SP-*.md"
    - "docs/specs/*/**"
    - "docs/reference/archive/**"
    - "docs/adr/ADR-*.md"
    - "docs/submit_proposals/SP-*.md"
    - "docs/change_packs/CPK-*.md"
    - "docs/closure/CR-*.md"
    - "docs/closure/evidence/EV-*.jsonl"
    - "specs/**"
    - "src/**"
    - "tests/**"
    - "database/**"
    - "package.json"
