# 项目拥有的紧凑 overlay；受管默认值位于 .p2t2c/defaults.yaml。
project:
  name: "YourProject"
  description: "请替换为项目描述"
  language: "zh-CN"
  language_policy: "monolingual_release_root"

methodology:
  profile: "p2t2c-adaptive-v2"
  enforcement: "advisory"
  tdd: "risk_aware"
  debugging: "root_cause_first"
  review:
    r1_production_code: "required"
    r2: "required"
  isolation: "auto"
  parallel_execution: "owned_isolated_only"
  fan_out: "controller_only"
  wait_strategy: "event_driven"

# 继承的 section 应省略。若覆盖 methodology、verification 或 path
# mapping，必须声明完整受控 section；残缺 override 会失败。
